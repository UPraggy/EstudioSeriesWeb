# Testa e publica o Estúdio de Séries Web no GitHub Pages.
# O site roda SEM backend: o próprio backend (backend/src) é empacotado para rodar dentro do navegador
# (frontend/vite-plugin-motor.js). Por isso mudanças no backend também republicam o site.
# Só roda depois que o repositório existir no GitHub e o Pages estiver com "Source: GitHub Actions".
# Nada secreto entra aqui: a chave do OpenRouter fica no navegador de quem usa (ou no PC, no modo Estúdio do PC).
name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      # Testes do backend e do motor do navegador (rodam sem rede e sem chave).
      - run: npm test
      - run: npm run build:pages
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
